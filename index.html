<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JCM HQ</title>
    <meta name="theme-color" content="#12213B" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&family=Roboto+Condensed:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <!-- Loaded directly (not the html2pdf.js wrapper) so the quotation PDF export can
         assemble pages manually — one html2canvas capture + jsPDF addImage per page —
         instead of relying on automatic slicing, which cuts rows mid-content. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Draws the "Scan to Pay" UPI QR at view time so it encodes THIS quotation's
         own payable amount. If the CDN is unreachable the quotation still renders —
         quotation-view.js falls back to the static payee-only QR rather than
         leaving a blank square where the code should be. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
