<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>JCM Tools — No internet</title>
<!-- Served from inside the APK, not from the website: this is the page the
     WebView falls back to when it cannot reach jcm-crm.vercel.app, so it has
     to stand on its own with no network, no fonts and no stylesheet. Hence
     the inline CSS and the system font stack. -->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 32px 28px calc(32px + env(safe-area-inset-bottom));
    background: #12213b;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    text-align: center;
  }
  .mark {
    width: 64px; height: 64px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, 0.08);
    box-shadow: 0 0 0 2px #d9ae55;
  }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.01em; }
  p { margin: 0; max-width: 30ch; font-size: 14px; line-height: 1.55; color: #c9cfda; }
  button {
    margin-top: 6px;
    min-height: 44px;
    padding: 0 26px;
    border: 0;
    border-radius: 12px;
    background: #d9ae55;
    color: #12213b;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
  }
  button:active { background: #c89c45; }
  .foot { font-size: 12px; color: #8b94a6; }
</style>
</head>
<body>
  <div class="mark">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#d9ae55"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 1l22 22" />
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
      <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
      <line x1="12" y1="20" x2="12.01" y2="20" />
    </svg>
  </div>
  <h1>No internet connection</h1>
  <p>JCM Tools loads live from the office server, so it needs a connection to
     open. Check mobile data or Wi-Fi and try again.</p>
  <button type="button" id="retry">Try again</button>
  <p class="foot">J.C. Mittal &amp; Sons · Ratlam</p>
  <script>
    document.getElementById('retry').addEventListener('click', function () {
      // Back to the live site. If it is still unreachable the WebView lands
      // right back here, which is the correct outcome.
      window.location.replace('https://jcm-crm.vercel.app/');
    });
  </script>
</body>
</html>
