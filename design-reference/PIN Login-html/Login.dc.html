<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JCM Tools — PIN login</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#12213B}a:hover{color:#0C111B}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #12213B; font-family: Inter, system-ui, sans-serif; color: #12213B; overflow: hidden">

<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 40px 24px 36px">
<img src="./assets/4781d3368b669df6ff64dfb8e32cc43a.png" alt="JCM Retails" style="width: 104px; height: 104px; border-radius: 50%; box-shadow: 0 0 0 3px #12213B, 0 0 0 5px #D9AE55">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 8px">
<h1 style="margin: 0; font-family: 'Playfair Display', serif; font-size: 34px; font-weight: 700; color: #FFFFFF; letter-spacing: 0.01em">JCM Tools</h1>
<span style="width: 36px; height: 2px; background: #D9AE55"></span>
<p style="margin: 0; font-size: 14px; color: #C9CFDA">Electrical &amp; Electronic Projects</p>
</div>
</div>

<div style="background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 26px 32px 22px; display: flex; flex-direction: column; align-items: center; gap: 18px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Enter your 4-digit PIN</h2>
<div role="status" aria-label="{{pinLabel}}" style="display: flex; gap: 18px">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
<span style="{{d.style}}"></span>
</sc-for>
</div>
<p style="{{msgStyle}}">{{msg}}</p>
</div>

<div style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<sc-if value="{{k.isDigit}}" hint-placeholder-val="{{ true }}">
<button onClick="{{k.press}}" style="height: 64px; border: 0; border-radius: 18px; background: #F3F4F6; color: #12213B; font-family: inherit; font-size: 28px; font-weight: 600; cursor: pointer">{{k.label}}</button>
</sc-if>
<sc-if value="{{k.isBack}}" hint-placeholder-val="{{ false }}">
<button onClick="{{k.press}}" aria-label="Delete last digit" style="height: 64px; border: 0; border-radius: 18px; background: transparent; color: #12213B; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"></path><path d="M17 9l-5 6M12 9l5 6"></path></svg>
</button>
</sc-if>
<sc-if value="{{k.isBlank}}" hint-placeholder-val="{{ false }}">
<span></span>
</sc-if>
</sc-for>
</div>

<p style="margin: 4px 0 0; font-size: 12px; color: #5B6270">J.C. Mittal &amp; Sons · Ratlam</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pin: '', status: 'idle' };
  }
  press(v) {
    if (this.state.status === 'ok') return;
    if (v === 'back') { this.setState({ pin: this.state.pin.slice(0, -1), status: 'idle' }); return; }
    const pin = (this.state.status === 'wrong' ? '' : this.state.pin) + v;
    if (pin.length < 4) { this.setState({ pin, status: 'idle' }); return; }
    // Demo only: 1234 unlocks. The real app checks the PIN on the server.
    this.setState({ pin, status: pin === '1234' ? 'ok' : 'wrong' });
  }
  renderVals() {
    const { pin, status } = this.state;
    const fill = status === 'wrong' ? '#C8312B' : status === 'ok' ? '#1F8A4C' : '#12213B';
    const dots = [0, 1, 2, 3].map((i) => ({
      style: 'width: 16px; height: 16px; border-radius: 50%; box-sizing: border-box; ' +
        (i < pin.length ? 'background: ' + fill + '; border: 2px solid ' + fill : 'background: transparent; border: 2px solid #B8BFCB')
    }));
    const order = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'back'];
    const keys = order.map((k) => ({
      label: k, isDigit: k !== '' && k !== 'back', isBack: k === 'back', isBlank: k === '',
      press: () => this.press(k)
    }));
    let msg = 'Your PIN keeps the app locked on this phone';
    let color = '#5B6270';
    if (status === 'wrong') { msg = 'Wrong PIN — try again'; color = '#9B1C1C'; }
    if (status === 'ok') { msg = 'Unlocked — opening JCM Tools…'; color = '#155C33'; }
    return {
      dots, keys, msg,
      pinLabel: pin.length + ' of 4 digits entered',
      msgStyle: 'margin: 0; min-height: 18px; font-size: 13px; font-weight: 500; color: ' + color
    };
  }
}
</script>
</body>
</html>
